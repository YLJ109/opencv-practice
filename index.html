"explanation":"拉普拉斯金字塔保存差值细节，配合高斯金字塔可以恢复原始图像。","compact":true},{"id":189,"type":"判断题","topic":"视觉基础","prompt":"深度学习做计算机视觉，需要人工手动全部设计图像特征。( )","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":"错误","accepted":["错误"],"explanation":"深度学习可以由神经网络自动学习特征，不需要专家手动设计全部特征。","compact":true},{"id":190,"type":"判断题","topic":"特征匹配与拼接","prompt":"SIFT 算法可以实现尺度不变，旋转不变，抗光照干扰。( )","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":"正确","accepted":["正确"],"explanation":"SIFT 通过高斯差分金字塔实现尺度不变，给关键点分配方向实现旋转不变。","compact":true},{"id":191,"type":"判断题","topic":"人脸检测与识别","prompt":"级联分类器使用排除法，先过滤大量明显不是目标的区域，减少计算量。( )","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":"正确","accepted":["正确"],"explanation":"简单分类器先筛除大量负样本，后面再做精细判断，提升检测速度。","compact":false},{"id":192,"type":"判断题","topic":"视频读写","prompt":"cv2.VideoCapture 既可以读取本地视频文件，也可以读取摄像头实时画面。( )","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":"正确","accepted":["正确"],"explanation":"传入文件路径读取本地视频;传入数字索引打开摄像头设备。","compact":false},{"id":193,"type":"判断题","topic":"视觉基础","prompt":"图像处理的工作目标主要是改善图像的视觉效果。( )","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":"正确","accepted":["正确"],"explanation":"图像处理是对图像做加工调整，改善图像视觉效果，是计算机视觉的相关学科。","compact":true},{"id":194,"type":"判断题","topic":"颜色与图像运算","prompt":"两幅图像做加权加法运算，两幅图像的尺寸和通道数可以不相同。( )","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":"错误","accepted":["错误"],"explanation":"图像加法、加权加法运算，要求输入两张图像尺寸、通道数必须保持一致。","compact":true},{"id":195,"type":"判断题","topic":"图像滤波","prompt":"高斯滤波核越靠近边缘位置，权重数值越大。( )","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":"错误","accepted":["错误"],"explanation":"高斯滤波中心权重最大，向四周逐步变小。","compact":false},{"id":196,"type":"判断题","topic":"直方图与阈值","prompt":"Otsu 阈值处理不需要人为手动指定分割阈值，算法自动计算最优阈值。( )","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":"正确","accepted":["正确"],"explanation":"Otsu 算法基于直方图自动求取阈值，调用时 thresh 参数填 0。","compact":true},{"id":197,"type":"判断题","topic":"颜色与图像运算","prompt":"numpy 加号做图像像素相加，像素和超过 255 时直接截断为 255。( )","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":"错误","accepted":["错误"],"explanation":"numpy “+” 执行取模;cv2.add 函数才会将超过 255 的值截断为 255。","compact":false},{"id":198,"type":"判断题","topic":"视觉基础","prompt":"实例分割可以区分属于同一类别的不同物体个体。( )","options":[{"key":"正确","text":"正确"},{"key":"错误","text":"错误"}],"answer":"正确","accepted":["正确"],"explanation":"语义分割只区分类别;实例分割可以区分同一类别下不同实例对象。","compact":true},{"id":199,"type":"简答题","topic":"人脸检测与识别","prompt":"简述 Haar 级联分类器的核心思想，什么是正样本与负样本。","options":[],"answer":"Haar 级联分类器采用排除法的思想，将多个简单分类器串联，层层筛选，快速排除不是目标的区域，留下符合条件的目标。\n 正样本是属于待检测目标的样本，比如人脸检测任务里的人脸图像；\n 负样本是不属于待检测目标的样本，也就是非人脸的图像。","accepted":["Haar 级联分类器采用排除法的思想，将多个简单分类器串联，层层筛选，快速排除不是目标的区域，留下符合条件的目标。\n 正样本是属于待检测目标的样本，比如人脸检测任务里的人脸图像；\n 负样本是不属于待检测目标的样本，也就是非人脸的图像。"],"explanation":"","compact":true},{"id":200,"type":"简答题","topic":"视频读写","prompt":"什么是视频分帧，简述视频分帧的作用。","options":[],"answer":"视频分帧就是把完整的视频文件拆解，将视频里面每一帧图像单独保存为一张张图片。\n 视频分帧可以把动态视频转化为静态图像数据集；方便对视频内关键画面做查看、截取；可以针对单张图片做图像算法处理，完成目标识别、计数等任务，为后续计算机视觉处理提供数据基础。","accepted":["视频分帧就是把完整的视频文件拆解，将视频里面每一帧图像单独保存为一张张图片。\n 视频分帧可以把动态视频转化为静态图像数据集；方便对视频内关键画面做查看、截取；可以针对单张图片做图像算法处理，完成目标识别、计数等任务，为后续计算机视觉处理提供数据基础。"],"explanation":"","compact":true},{"id":201,"type":"简答题","topic":"图像滤波","prompt":"简述中值滤波的原理，它适合处理什么噪声，为什么中值滤波的卷积核 ksize 必须为正奇数？","options":[],"answer":"中值滤波将邻域内像素灰度排序，取中间值作为输出像素值。\n 它非常适合去除椒盐噪声。\n 卷积核必须是正奇数，是为了滤波窗口存在明确的中心像素点，方便选取邻域并获取排序后的中间灰度值，保证滤波运算正常执行。","accepted":["中值滤波将邻域内像素灰度排序，取中间值作为输出像素值。\n 它非常适合去除椒盐噪声。\n 卷积核必须是正奇数，是为了滤波窗口存在明确的中心像素点，方便选取邻域并获取排序后的中间灰度值，保证滤波运算正常执行。"],"explanation":"","compact":true},{"id":202,"type":"简答题","topic":"直方图与阈值","prompt":"简述 Otsu 阈值处理的原理，以及它适合和不适合的图像场景。","options":[],"answer":"Otsu 阈值处理也叫最大类间方差法。\n 算法自动遍历寻找最佳阈值，使前景、背景的类内方差最小，类间方差最大，无需人工指定阈值。\n 适合灰度直方图呈双峰，前景与背景灰度区分明显的图像；不适合直方图没有双峰、光照复杂、前景背景灰度重叠严重的图像。","accepted":["Otsu 阈值处理也叫最大类间方差法。\n 算法自动遍历寻找最佳阈值，使前景、背景的类内方差最小，类间方差最大，无需人工指定阈值。\n 适合灰度直方图呈双峰，前景与背景灰度区分明显的图像；不适合直方图没有双峰、光照复杂、前景背景灰度重叠严重的图像。"],"explanation":"","compact":true},{"id":203,"type":"简答题","topic":"边缘与图像金字塔","prompt":"简述高斯金字塔与拉普拉斯金字塔的构建思路，说明下采样之后直接上采样为什么不能恢复原始图像。","options":[],"answer":"高斯金字塔通过高斯滤波加下采样构建，层级越高图像分辨率越小。\n 拉普拉斯金字塔每一层等于高斯金字塔对应层减去上一层高斯图像的上采样结果，保存下采样丢失的细节信息。\n 下采样会丢弃部分像素信息，直接上采样只能插值补全像素，无法还原丢失的细节，因此不能恢复原图；借助拉普拉斯金字塔保存的差值信息才可以复原图像。","accepted":["高斯金字塔通过高斯滤波加下采样构建，层级越高图像分辨率越小。\n 拉普拉斯金字塔每一层等于高斯金字塔对应层减去上一层高斯图像的上采样结果，保存下采样丢失的细节信息。\n 下采样会丢弃部分像素信息，直接上采样只能插值补全像素，无法还原丢失的细节，因此不能恢复原图；借助拉普拉斯金字塔保存的差值信息才可以复原图像。"],"explanation":"","compact":true},{"id":204,"type":"简答题","topic":"视觉基础","prompt":"简述图像数字化包含哪两个环节，并分别说明其作用。","options":[],"answer":"图像数字化分为采样和量化两个环节。\n 采样是把空间上连续的模拟图像转换为离散像素点的过程，完成空间维度的离散化。\n 量化是将采样得到的连续灰度值转换成离散整数值。量化等级越高，图像信息越丰富、画质越好，但数据量更大。\n 经过采样与量化后模拟图像就转变为计算机可处理的数字图像。","accepted":["图像数字化分为采样和量化两个环节。\n 采样是把空间上连续的模拟图像转换为离散像素点的过程，完成空间维度的离散化。\n 量化是将采样得到的连续灰度值转换成离散整数值。量化等级越高，图像信息越丰富、画质越好，但数据量更大。\n 经过采样与量化后模拟图像就转变为计算机可处理的数字图像。"],"explanation":"","compact":true},{"id":205,"type":"简答题","topic":"颜色与图像运算","prompt":"简述 HSV 色彩空间 H、S、V 三个分量的含义，以及 OpenCV 中各分量的取值范围。","options":[],"answer":"HSV 包含色调 H、饱和度 S、亮度 V 三个分量。\n （1）H 代表色调，表示色彩的基本属性，用来区分红、蓝、黄等颜色；\n （2）S 为饱和度，表示色彩的纯度；\n （3）V 是亮度，表示人眼感受到的光线明暗程度。\n 在 OpenCV 中，H 取值范围 0‑180，S 取值范围 0‑255，V 取值范围 0‑255。","accepted":["HSV 包含色调 H、饱和度 S、亮度 V 三个分量。\n （1）H 代表色调，表示色彩的基本属性，用来区分红、蓝、黄等颜色；\n （2）S 为饱和度，表示色彩的纯度；\n （3）V 是亮度，表示人眼感受到的光线明暗程度。\n 在 OpenCV 中，H 取值范围 0‑180，S 取值范围 0‑255，V 取值范围 0‑255。"],"explanation":"","compact":true},{"id":206,"type":"简答题","topic":"边缘与图像金字塔","prompt":"简述 Canny 边缘检测算法的四个主要步骤，并说明高低双阈值的判定规则。","options":[],"answer":"第一步使用高斯滤波对图像降噪；\n 第二步计算图像每个像素的梯度幅值与方向；\n 第三步对梯度幅值做非极大值抑制，细化边缘；\n 第四步采用高低双阈值完成滞后阈值检测。\n 判定规则：\n 梯度大于高阈值为强边缘；小于低阈值判定为非边缘；介于两阈值之间时，和强边缘连通则为弱边缘，不连通则舍弃。","accepted":["第一步使用高斯滤波对图像降噪；\n 第二步计算图像每个像素的梯度幅值与方向；\n 第三步对梯度幅值做非极大值抑制，细化边缘；\n 第四步采用高低双阈值完成滞后阈值检测。\n 判定规则：\n 梯度大于高阈值为强边缘；小于低阈值判定为非边缘；介于两阈值之间时，和强边缘连通则为弱边缘，不连通则舍弃。"],"explanation":"","compact":true},{"id":207,"type":"编程题","topic":"边缘与图像金字塔","prompt":"现有图片shape.png，图片中包含多个封闭几何图形，请编写 Python+OpenCV 程序完成下面任务：\n （1）读取彩色原始图像；\n （2）将彩色图像转换为灰度图像，使用(5,5)的卷积核进行高斯滤波降噪；\n （3）对滤波之后的图像执行 Canny 边缘检测，低阈值 70，高阈值 200；\n （4）调用轮廓查找函数，只查找图像最外层轮廓，轮廓近似方法采用cv2.CHAIN_APPROX_SIMPLE；\n （5）复制原始图像，在复制的图像上使用黄色(0,255,255)、线宽 2 绘制出全部检测到的轮廓；\n （6）依次显示灰度图像、Canny 边缘检测图像、绘制完轮廓的结果图像；\n （7）按任意按键关闭全部 OpenCV 窗口。\n 输入说明：\n 图片文件shape.png，图片与代码放置在同一个工作目录。\n 输出说明：\n 窗口一共 3 个\n ① GrayWin：灰度图像\n ② CannyWin：Canny 边缘检测结果图像\n ③ ContourWin：绘制轮廓后的结果图像","options":[],"answer":"import cv2\n \n\n #1.读取原图\n\n img = cv2.imread(\"shape.png\")\n \n\n #2.转灰度\n\n gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n cv2.imshow(\"GrayWin\", gray)\n \n\n #3.高斯滤波降噪\n\n blur_img = cv2.GaussianBlur(gray, (5, 5), 1)\n \n\n #4. Canny边缘检测\n\n canny_img = cv2.Canny(blur_img, 70, 200)\n cv2.imshow(\"CannyWin\", canny_img)\n \n\n #5.查找最外层轮廓\n\n contours, hierarchy = cv2.findContours(canny_img, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\n \n\n #6.复制图像，绘制全部轮廓\n\n draw_img = img.copy()\n cv2.drawContours(draw_img, contours, -1, (0, 255, 255), 2)\n cv2.imshow(\"ContourWin\", draw_img)\n \n\n #7.窗口等待与资源释放\n\n cv2.waitKey(0)\n cv2.destroyAllWindows()","accepted":["import cv2\n \n\n #1.读取原图\n\n img = cv2.imread(\"shape.png\")\n \n\n #2.转灰度\n\n gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n cv2.imshow(\"GrayWin\", gray)\n \n\n #3.高斯滤波降噪\n\n blur_img = cv2.GaussianBlur(gray, (5, 5), 1)\n \n\n #4. Canny边缘检测\n\n canny_img = cv2.Canny(blur_img, 70, 200)\n cv2.imshow(\"CannyWin\", canny_img)\n \n\n #5.查找最外层轮廓\n\n contours, hierarchy = cv2.findContours(canny_img, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\n \n\n #6.复制图像，绘制全部轮廓\n\n draw_img = img.copy()\n cv2.drawContours(draw_img, contours, -1, (0, 255, 255), 2)\n cv2.imshow(\"ContourWin\", draw_img)\n \n\n #7.窗口等待与资源释放\n\n cv2.waitKey(0)\n cv2.destroyAllWindows()"],"explanation":"","compact":true},{"id":208,"type":"编程题","topic":"颜色与图像运算","prompt":"现有一张apple.jpg苹果彩色图片，苹果主体为红色，背景为绿色树叶，请基于 HSV 色彩空间完成红色苹果的色彩分割，按照下面要求编写 Python+OpenCV 程序：\n （1）读取图像，显示原始 BGR 图像；\n （2）将 BGR 图像转换为 HSV 色彩空间；\n 参考颜色表：红色 H 范围：0‑10，S：43‑255，V：46‑255\n （3）使用cv2.inRange()生成红色苹果的二值掩模 mask，显示掩模图像；\n （4）利用按位与运算 + 掩模，把原图中红色苹果提取出来，背景置黑色，显示提取后的苹果图像；\n （5）按键任意键关闭全部窗口。\n 输入说明：\n 图片文件为apple.jpg，和代码放在同一目录。\n 输出说明：\n 窗口一共 3 个\n ① Original：原始图片\n ② Red Mask：红色苹果二值掩模（苹果区域白色，树叶背景黑色）\n ③ Apple_Foreground：苹果提取结果，背景黑色","options":[],"answer":"import cv2\n import numpy as np\n \n\n #1.读取图像\n\n img = cv2.imread(\"apple.jpg\")\n cv2.imshow(\"Original\", img)\n \n\n #2.BGR转HSV\n\n hsv_img = cv2.cvtColor(img, cv2.COLOR_BGR2HSV)\n \n\n #红色阈值\n\n lower_red = np.array([0, 43, 46])\n upper_red = np.array([10, 255, 255])\n \n\n #3.生成红色掩模\n\n mask = cv2.inRange(hsv_img, lower_red, upper_red)\n cv2.imshow(\"Red Mask\", mask)\n \n\n #4.提取苹果前景（背景变黑）\n\n mask_not = cv2.bitwise_not(mask)\n apple_fore = cv2.bitwise_and(img, img, mask=mask_not)\n cv2.imshow(\"Apple_Foreground\", apple_fore)\n \n\n #5.窗口等待与释放\n\n cv2.waitKey(0)\n cv2.destroyAllWindows()","accepted":["import cv2\n import numpy as np\n \n\n #1.读取图像\n\n img = cv2.imread(\"apple.jpg\")\n cv2.imshow(\"Original\", img)\n \n\n #2.BGR转HSV\n\n hsv_img = cv2.cvtColor(img, cv2.COLOR_BGR2HSV)\n \n\n #红色阈值\n\n lower_red = np.array([0, 43, 46])\n upper_red = np.array([10, 255, 255])\n \n\n #3.生成红色掩模\n\n mask = cv2.inRange(hsv_img, lower_red, upper_red)\n cv2.imshow(\"Red Mask\", mask)\n \n\n #4.提取苹果前景（背景变黑）\n\n mask_not = cv2.bitwise_not(mask)\n apple_fore = cv2.bitwise_and(img, img, mask=mask_not)\n cv2.imshow(\"Apple_Foreground\", apple_fore)\n \n\n #5.窗口等待与释放\n\n cv2.waitKey(0)\n cv2.destroyAllWindows()"],"explanation":"","compact":true},{"id":209,"type":"编程题","topic":"图像滤波","prompt":"现有一张带椒盐噪声的图片noise_cat.jpg，请编写 Python+OpenCV 程序完成下面任务：\n （1）读取噪声彩色图片，显示原始噪声图像；\n （2）直接对彩色原图分别做：均值滤波、高斯滤波、中值滤波\n 均值滤波核大小(5,5)；\n 高斯滤波核大小(5,5)，sigmaX=2；\n 中值滤波核大小5；\n （3）分别显示均值滤波、高斯滤波、中值滤波处理之后的彩色结果图像；\n （4）将原始彩色图像转为灰度图，提取灰度图的直方图；把中值滤波得到的彩色结果转为灰度，提取它的直方图；在同一张画布绘制两条直方图曲线做对比；\n （5）按任意键关闭全部窗口。\n 输入说明：\n 图片文件noise_cat.jpg，代码与图片放在同一工作目录。\n 输出说明：\n 窗口一共 5 个\n ① Original：原始带噪声彩色图\n ② MeanBlur：均值滤波彩色结果\n ③ GaussianBlur：高斯滤波彩色结果\n ④ MedianBlur：中值滤波彩色结果\n ⑤ matplotlib 绘图窗口：绘制两条直方图曲线。","options":[],"answer":"import cv2\n import matplotlib.pyplot as plt\n \n\n #1.读取彩色图像\n\n img = cv2.imread(\"noise_cat.jpg\")\n cv2.imshow(\"Original\", img)\n \n\n #2.直接对彩色图像执行三种滤波\n\n mean_blur = cv2.blur(img,(5,5))\n gauss_blur = cv2.GaussianBlur(img,(5,5),2)\n median_blur = cv2.medianBlur(img,5)\n \n\n #3.显示滤波后的彩色图像\n\n cv2.imshow(\"MeanBlur\", mean_blur)\n cv2.imshow(\"GaussianBlur\", gauss_blur)\n cv2.imshow(\"MedianBlur\", median_blur)\n \n\n #4.转为灰度，获取两组直方图，绘制对比\n gray_origin = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n gray_med = cv2.cvtColor(median_blur, cv2.COLOR_BGR2GRAY)\n hist_gray = cv2.calcHist([gray_origin],[0],None,[256],[0,255])\n hist_med = cv2.calcHist([gray_med],[0],None,[256],[0,255])\n plt.plot(hist_gray)\n plt.plot(hist_med)\n plt.show()\n \n\n #5.窗口等待释放\n\n cv2.waitKey(0)\n cv2.destroyAllWindows()","accepted":["import cv2\n import matplotlib.pyplot as plt\n \n\n #1.读取彩色图像\n\n img = cv2.imread(\"noise_cat.jpg\")\n cv2.imshow(\"Original\", img)\n \n\n #2.直接对彩色图像执行三种滤波\n\n mean_blur = cv2.blur(img,(5,5))\n gauss_blur = cv2.GaussianBlur(img,(5,5),2)\n median_blur = cv2.medianBlur(img,5)\n \n\n #3.显示滤波后的彩色图像\n\n cv2.imshow(\"MeanBlur\", mean_blur)\n cv2.imshow(\"GaussianBlur\", gauss_blur)\n cv2.imshow(\"MedianBlur\", median_blur)\n \n\n #4.转为灰度，获取两组直方图，绘制对比\n gray_origin = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n gray_med = cv2.cvtColor(median_blur, cv2.COLOR_BGR2GRAY)\n hist_gray = cv2.calcHist([gray_origin],[0],None,[256],[0,255])\n hist_med = cv2.calcHist([gray_med],[0],None,[256],[0,255])\n plt.plot(hist_gray)\n plt.plot(hist_med)\n plt.show()\n \n\n #5.窗口等待释放\n\n cv2.waitKey(0)\n cv2.destroyAllWindows()"],"explanation":"","compact":true},{"id":210,"type":"编程题","topic":"形态学与轮廓","prompt":"现有图像stone.png，画面中有若干石块目标，背景散布很多细小白色噪点。请编写 Python+OpenCV 完成以下任务：\n （1）读取彩色原始图像；\n （2）将彩色图像转为灰度图像，显示灰度窗口；\n （3）使用 Otsu 自动阈值做二值化处理THRESH_BINARY + THRESH_OTSU，显示 Otsu 二值图；\n （4）构建(3,3)矩形结构元素，对二值图像执行开运算，消除背景细小噪点，显示开运算处理后的图像；\n （5）查找图像最外层轮廓，轮廓近似方法选用cv2.CHAIN_APPROX_SIMPLE；\n （6）打印输出检测到的石块总个数；\n （7）按任意键关闭全部 OpenCV 窗口。\n 输入说明：\n 图片文件stone.jpg，代码与图片放在同一工作目录。\n\n 输出说明：\n 窗口一共 3 个\n ① GrayWin：灰度图像\n ② OtsuBinWin：Otsu 二值化图像\n ③ OpenWin：开运算去噪图像\n 控制台输出：打印检测到的石块数量。","options":[],"answer":"import cv2\n \n\n #1.读取彩色原图\n\n img = cv2.imread(\"stone.png\")\n \n\n #2.BGR转灰度图像\n\n gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n cv2.imshow(\"GrayWin\", gray)\n \n\n #3.Otsu自动阈值二值化\n\n ret, binary = cv2.threshold(gray, 0, 255, cv2.THRESH_BINARY + cv2.THRESH_OTSU)\n cv2.imshow(\"OtsuBinWin\", binary)\n \n\n #4.创建3×3矩形结构元素，执行开运算去除背景噪点\n\n kernel = cv2.getStructuringElement(cv2.MORPH_RECT, (3, 3))\n open_result = cv2.morphologyEx(binary, cv2.MORPH_OPEN, kernel)\n cv2.imshow(\"OpenWin\", open_result)\n \n\n #5.查找最外层轮廓\n\n contours, hierarchy = cv2.findContours(open_result, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\n \n\n #6.打印石块的总数量\n\n print(\"检测到石块数量：\", len(contours))\n \n\n #7.等待按键，释放全部窗口\n\n cv2.waitKey(0)\n cv2.destroyAllWindows()","accepted":["import cv2\n \n\n #1.读取彩色原图\n\n img = cv2.imread(\"stone.png\")\n \n\n #2.BGR转灰度图像\n\n gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\n cv2.imshow(\"GrayWin\", gray)\n \n\n #3.Otsu自动阈值二值化\n\n ret, binary = cv2.threshold(gray, 0, 255, cv2.THRESH_BINARY + cv2.THRESH_OTSU)\n cv2.imshow(\"OtsuBinWin\", binary)\n \n\n #4.创建3×3矩形结构元素，执行开运算去除背景噪点\n\n kernel = cv2.getStructuringElement(cv2.MORPH_RECT, (3, 3))\n open_result = cv2.morphologyEx(binary, cv2.MORPH_OPEN, kernel)\n cv2.imshow(\"OpenWin\", open_result)\n \n\n #5.查找最外层轮廓\n\n contours, hierarchy = cv2.findContours(open_result, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\n \n\n #6.打印石块的总数量\n\n print(\"检测到石块数量：\", len(contours))\n \n\n #7.等待按键，释放全部窗口\n\n cv2.waitKey(0)\n cv2.destroyAllWindows()"],"explanation":"","compact":true}];

const KEY='vision-practice-v1';let state={records:{},saved:[],last:1};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}let mode='all',topic='all',type='all',bank='full',query='',index=0,mapIndex=0,selected=null,revealed=false,submitted=false,randomOrder=null;let filtered=[];

function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',2300)}
function baseList(){return QUESTIONS.filter(q=>(bank==='full'||q.compact)&&(topic==='all'||q.topic===topic)&&(mode!=='wrong'||state.records[q.id]?.correct===false)&&(mode!=='saved'||state.saved.includes(q.id))&&(mode!=='todo'||!state.records[q.id])&&(!query||(q.prompt+' '+q.topic+' '+q.options.map(x=>x.text).join(' ')).toLowerCase().includes(query.toLowerCase())))}
function refresh(keepId){let base=baseList();filtered=base.filter(q=>type==='all'||q.type===type);if(randomOrder){const ranks=new Map(randomOrder.map((id,i)=>[id,i]));filtered.sort((a,b)=>(ranks.get(a.id)??999)-(ranks.get(b.id)??999))}index=Math.max(0,keepId?filtered.findIndex(q=>q.id===keepId):0);mapIndex=Math.floor(index/90);renderFilters(base);resetQuestion();render()}
function renderFilters(base){$('#types').innerHTML=['全部题型','单选题','填空题','判断题','简答题','编程题'].map((t,i)=>`<button data-type="${i?t:'all'}" class="${type===(i?t:'all')?'active':''}">${t}<b>${i?base.filter(q=>q.type===t).length:base.length}</b></button>`).join('');$('#categories').innerHTML=['全部知识',...TOPICS].map((t,i)=>`<button data-topic="${i?t:'all'}" class="${topic===(i?t:'all')?'active':''}"><span>${i?t:'全部知识'}</span><b>${QUESTIONS.filter(q=>(bank==='full'||q.compact)&&(!i||q.topic===t)).length}</b></button>`).join('');$('#modeTitle').textContent={all:'全部练习',wrong:'我的错题',saved:'收藏题目',todo:'未练习'}[mode];document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
function resetQuestion(){selected=null;revealed=false;submitted=false;const q=filtered[index];if(q){state.last=q.id;persist()}}
function record(correct,value){const q=filtered[index];state.records[q.id]={correct,value,at:Date.now()};persist();renderStats()}
function renderStats(){const records=Object.values(state.records);$('#allCount').textContent=QUESTIONS.length;$('#wrongCount').textContent=records.filter(r=>!r.correct).length;$('#savedCount').textContent=state.saved.length;$('#todoCount').textContent=QUESTIONS.length-records.length;const done=filtered.filter(q=>state.records[q.id]),right=done.filter(q=>state.records[q.id].correct).length;$('#progressCount').textContent=done.length;$('#filteredTotal').textContent=filtered.length;$('#correctStat').textContent=right;$('#wrongStat').textContent=done.length-right;$('#pendingStat').textContent=filtered.length-done.length;$('#accuracy').textContent='正确率 '+(done.length?Math.round(right/done.length*100)+'%':'—');$('#progressBar').style.width=(filtered.length?done.length/filtered.length*100:0)+'%';renderMap()}
function renderMap(){const total=Math.max(1,Math.ceil(filtered.length/90));mapIndex=Math.min(mapIndex,total-1);$('#map').innerHTML=filtered.slice(mapIndex*90,mapIndex*90+90).map((q,i)=>`<button aria-label="跳转第${q.id}题" data-index="${mapIndex*90+i}" class="${mapIndex*90+i===index?'current ':''}${state.records[q.id]?(state.records[q.id].correct?'correct':'incorrect'):''}">${q.id}</button>`).join('');$('#mapPage').textContent=`${mapIndex+1} / ${total}`;$('#mapRange').textContent=filtered.length+' 题';$('#mapPrev').disabled=mapIndex===0;$('#mapNext').disabled=mapIndex===total-1}
const questionUI=new Map();
function ui(q){if(!questionUI.has(q.id))questionUI.set(q.id,{selected:null,revealed:false,submitted:false,value:''});return questionUI.get(q.id)}
function answerHTML(q,u){let answer=q.answer;if(q.type==='单选题'){const o=q.options.find(x=>x.key===answer);if(o)answer+=' · '+o.text}return `<div class="answer-panel ${u.submitted&&state.records[q.id]?.correct===false?'error':''}" role="status"><h3>${u.submitted?(state.records[q.id]?.correct?'✓ 回答正确':'回答错误'):'参考答案'}</h3><div class="answer-content ${q.type==='编程题'?'code':''}">${esc(answer)}</div>${q.explanation?`<div class="explanation">${esc(q.explanation)}</div>`:''}${['简答题','编程题'].includes(q.type)?'<div class="self-grade"><button data-grade="true">✓ 已掌握</button><button data-grade="false">↺ 需练习</button></div>':''}</div>`}
function cardHTML(q){const u=ui(q);let input='';if(q.type==='单选题'||q.type==='判断题'){input='<div class="options">'+q.options.map(o=>`<button class="option ${u.selected===o.key?'selected ':''}${u.revealed&&q.answer===o.key?'right ':''}${u.submitted&&u.selected===o.key&&q.answer!==o.key?'wrong':''}" data-option="${o.key}" ${u.submitted||u.revealed?'disabled':''}><span class="letter">${q.type==='判断题'?(o.key==='正确'?'✓':'×'):o.key}</span><span>${esc(o.text)}</span>${u.revealed&&o.key===q.answer?'<span class="answer-symbol">✓</span>':''}</button>`).join('')+'</div>'}else if(q.type==='填空题'){input=`<input class="answer-input" data-fill aria-label="第${q.id}题答案" placeholder="输入答案" value="${esc(u.value)}" ${u.submitted||u.revealed?'disabled':''}>`}else{input=`<textarea class="answer-input large" data-draft aria-label="第${q.id}题草稿" placeholder="${q.type==='编程题'?'编写代码…':'填写答案…'}">${esc(state.drafts?.[q.id]||'')}</textarea>`}return `<div class="q-top"><div class="q-meta"><span class="q-number">${String(q.id).padStart(3,'0')}</span><span class="badge">${q.type}</span><span class="topic-badge">${q.topic}</span></div><button class="save-btn ${state.saved.includes(q.id)?'saved':''}" data-save aria-label="${state.saved.includes(q.id)?'取消收藏':'收藏题目'}">${state.saved.includes(q.id)?'★':'☆'}</button></div><h2 class="question-title">${esc(q.prompt)}</h2>${input}${u.revealed?answerHTML(q,u):''}<div class="q-actions"><button class="reveal" data-reveal>${u.revealed?'收起答案':'查看答案'}</button>${!u.submitted&&!u.revealed&&q.type==='填空题'?`<button class="primary" data-submit ${q.type!=='填空题'&&!u.selected?'disabled':''}>提交答案</button>`:''}</div>`}
function render(){if(!filtered.length){$('#questionCard').innerHTML='<div class="empty"><h2>暂无题目</h2><button data-clear>清除筛选</button></div>'}else{$('#questionCard').innerHTML=filtered.map(q=>`<section class="question-card" data-qid="${q.id}" id="q-${q.id}">${cardHTML(q)}</section>`).join('')}renderStats();observeCards()}
function updateCard(q){const el=$('#q-'+q.id);if(el)el.innerHTML=cardHTML(q);renderStats()}
function normalize(s){return s.normalize('NFKC').toLowerCase().replace(/[\s，。,.、;；:：()（）“”"']/g,'')}
function submitQuestion(q){const u=ui(q);if(u.submitted||u.revealed)return;const v=q.type==='填空题'?u.value.trim():u.selected;if(!v){toast('请先作答');return}const correct=q.type==='填空题'?q.accepted.some(a=>normalize(a)===normalize(v)):v===q.answer;state.records[q.id]={correct,value:v,at:Date.now()};u.submitted=true;u.revealed=true;persist();updateCard(q)}
let cardObserver;function observeCards(){cardObserver?.disconnect();cardObserver=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting){const idx=filtered.findIndex(q=>q.id===Number(e.target.dataset.qid));if(idx>=0){index=idx;mapIndex=Math.floor(idx/90);state.last=filtered[idx].id;renderMap()}}}},{rootMargin:'-80px 0px -55% 0px',threshold:0});document.querySelectorAll('[data-qid]').forEach(c=>cardObserver.observe(c))}
function jump(i){if(i<0||i>=filtered.length)return;index=i;mapIndex=Math.floor(i/90);$('#q-'+filtered[i].id)?.scrollIntoView({block:'start',behavior:'smooth'});renderMap()}
$('#types').onclick=e=>{const b=e.target.closest('[data-type]');if(b){type=b.dataset.type;refresh()}};
$('#categories').onclick=e=>{const b=e.target.closest('[data-topic]');if(b){topic=b.dataset.topic;$('#topicSelect').value=topic;refresh()}};
$('#modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(b){mode=b.dataset.mode;refresh()}};
$('#bank').onchange=e=>{bank=e.target.value;refresh()};$('#search').oninput=e=>{query=e.target.value;refresh()};
$('#shuffle').onclick=()=>{randomOrder=QUESTIONS.map(q=>q.id);for(let i=randomOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[randomOrder[i],randomOrder[j]]=[randomOrder[j],randomOrder[i]]}refresh()};
$('#map').onclick=e=>{const b=e.target.closest('[data-index]');if(b)jump(Number(b.dataset.index))};$('#mapPrev').onclick=()=>{mapIndex--;renderMap()};$('#mapNext').onclick=()=>{mapIndex++;renderMap()};
$('#reset').onclick=()=>{if(confirm('清空作答、收藏和草稿记录？')){state={records:{},saved:[],last:1};questionUI.clear();persist();refresh()}};
$('#questionCard').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-clear')){mode='all';topic='all';type='all';query='';$('#search').value='';$('#topicSelect').value='all';refresh();return}const el=b.closest('[data-qid]');if(!el)return;const q=QUESTIONS.find(q=>q.id===Number(el.dataset.qid));const u=ui(q);if(b.dataset.option){u.selected=b.dataset.option;submitQuestion(q)}else if(b.hasAttribute('data-submit'))submitQuestion(q);else if(b.hasAttribute('data-reveal')){u.revealed=!u.revealed;updateCard(q)}else if(b.hasAttribute('data-save')){state.saved=state.saved.includes(q.id)?state.saved.filter(x=>x!==q.id):[...state.saved,q.id];persist();updateCard(q)}else if(b.dataset.grade){state.records[q.id]={correct:b.dataset.grade==='true',value:'self',at:Date.now()};u.submitted=true;persist();updateCard(q)}};
$('#questionCard').addEventListener('input',e=>{const el=e.target.closest('[data-qid]');if(!el)return;const q=QUESTIONS.find(q=>q.id===Number(el.dataset.qid));if(e.target.hasAttribute('data-fill'))ui(q).value=e.target.value;else if(e.target.hasAttribute('data-draft')){state.drafts??={};state.drafts[q.id]=e.target.value;persist()}});
$('#questionCard').addEventListener('keydown',e=>{if(e.target.hasAttribute('data-fill')&&e.key==='Enter'){const q=QUESTIONS.find(q=>q.id===Number(e.target.closest('[data-qid]').dataset.qid));submitQuestion(q)}});
const mobileTopic=document.createElement('select');mobileTopic.id='topicSelect';mobileTopic.setAttribute('aria-label','知识分类');mobileTopic.innerHTML='<option value="all">全部知识分类</option>'+TOPICS.map(t=>'<option>'+esc(t)+'</option>').join('');$('.toolbar').insertBefore(mobileTopic,$('#bank'));mobileTopic.onchange=e=>{topic=e.target.value;refresh()};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowLeft')jump(index-1);else if(e.key==='ArrowRight')jump(index+1)});refresh();

let railFrame;function resizeRail(){const rail=document.querySelector('.right-column');if(rail&&innerWidth>800)rail.style.height=Math.max(220,innerHeight-rail.getBoundingClientRect().top-12)+'px';}
function scheduleRail(){cancelAnimationFrame(railFrame);railFrame=requestAnimationFrame(resizeRail)}window.addEventListener('resize',scheduleRail);window.addEventListener('scroll',scheduleRail,{passive:true});scheduleRail();
</script></body></html>
